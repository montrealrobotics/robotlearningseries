# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.
#
# If you need help with YAML syntax, here are some quick references for you: 
# https://learn-the-web.algonquindesign.ca/topics/markdown-yaml-cheat-sheet/#yaml
# https://learnxinyminutes.com/docs/yaml/
#
# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

title: Mila Robot Learning Seminar
tagline: Talks @ REAL + Mila
contact_email: robot-learning-seminar@mila.quebec # shown on the organizers page
# email: emailaddress@provider.com
description: >- # this means to ignore newlines until "baseurl:"
  A virtual seminar series on robot learning research, hosted by the Robotics and Embodied AI Lab
  (REAL) and Mila in Montréal. Talks are streamed live and recorded on YouTube.
timezone: America/Toronto # talk times are Eastern; also used for event start times
baseurl: "/robotlearningseries" # the subpath of your site, e.g. /blog
url: "https://montrealrobotics.ca" # the base hostname & protocol for your site, e.g. http://example.com
twitter:
  username: montrealrobots
github_username:  montrealrobotics

# Icons shown in the footer (see _includes/social.html)
minima:
  social_links:
    youtube_channel: UCOouaBg4gHIlNvPkJn_8ooA
    youtube_channel_name: Montreal Robotics YouTube
    twitter: montrealrobots

# Build settings
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# If you want to link only specific pages in your header, uncomment
# this and add the path to the pages in order as they should show up
header_pages:
- index.md
# - speakers.md
- organizers.md
# - callforpapers.md
# - schedule.md
# - papers.md
- fall2026.md
- winter2026.md
- fall2025.md
- fall2024.md
- summer2024.md
- winter2024.md
- fall2023.md
- winter2021.md
- fall2020.md
- summer2020.md
# - contactus.md

# # Specify the name of a file to show as a masthead graphic at the top of each page, instead of a title, here:
# masthead: assets/img/banner.jpg
# # Description (alt text) for the masthead
# masthead_description: Adapted from Machine Learning & Artificial Intelligence by mikemacmarketing; licensed under CC BY 2.0

# A two-line attribution (remove this if you have to, but we'd appreciate if you leave this as is)
attribution: >
  Based on a <a href="http://jekyllrb.com/" target="_blank">Jekyll</a> template from a <a href="https://krrish94.github.io">lazy grad student</a>.
  Some icons made by <a href="https://smashicons.com/" title="Smashicons">Smashicons</a> from <a href="https://www.flaticon.com/" title="Flaticon">www.flaticon.com</a>.

# Displays a "last updated" date in the footer if set to "true"
last_updated: true

# Define collections (speakers, organizers, papers)
# To turn off any of these collections, just set "output" to "false"
collections:
  speakers:
    sort_by: sequence_id
    output: false
  organizers:
    sort_by: sequence_id
    output: false
  # schedule:
  #   sort_by: sequence_id
  #   output: false
  # papers:
  #   sort_by: sequence_id
  #   output: false

# Exclude from processing.
# The following items will not be processed, by default.
# Note: on Jekyll 3 (which GitHub Pages uses), an `exclude:` list replaces this
# default list instead of adding to it, so the defaults are repeated below.
#
# Excluded items can be processed by explicitly listing the directories or
# their entries' file path in the `include:` list.
#
# exclude:
#   - .sass-cache/
#   - .jekyll-cache/
#   - gemfiles/
#   - Gemfile
#   - Gemfile.lock
#   - node_modules/
#   - vendor/bundle/
#   - vendor/cache/
#   - vendor/gems/
#   - vendor/ruby/
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - README.md
  - LICENSE.txt

# Google analytics id. Add your tracking id to get visitor stats.
google_analytics: UA-130243767-1

defaults:
  - scope:
      path: ""
    values:
      image:
        path: /assets/img/social-card.png
        width: 1200
        height: 630
        alt: "Mila Robot Learning Seminar Series"
